# Workspace root: not a package. Each package under packages/ has its own pyproject, version and tests.
[project]
name = "bureau-submissions-core-workspace"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = ["bureau-core", "canonical", "sources", "clientconfig", "app", "shell-azure"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bureau-core = { workspace = true }
canonical = { workspace = true }
sources = { workspace = true }
clientconfig = { workspace = true }
app = { workspace = true }
shell-azure = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4",
    "types-pyyaml>=6.0.12.20261103",
    "types-openpyxl>=3.1.5.20261017",
    "sqlglot==26.16.0",           # canonical.build_views: generated views must not change with the version
]

# Database drivers for the `db` tests (CI job "Database"); not needed for the unit tests.
db = ["pyodbc>=5.2", "psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q --strict-markers --import-mode=importlib"
filterwarnings = ["ignore:The default date(time)? adapter is deprecated:DeprecationWarning"]
markers = [
    "workbook: needs the local input workbooks (gitignored); skipped when BSC_WORKBOOK_DIR is not set",
    "db: needs a SQL Server or Postgres container (CI database job)",
    "perf: performance regression (nightly)",
]

[tool.coverage.run]
branch = true
source = ["packages"]
omit = ["*/tests/*", "*/testing_db.py"]   # testing_db: real-database setup, runs only in the Database job

[tool.coverage.report]
fail_under = 91          # baseline of the reference code (2026-11-05: 91% line); never lowered
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",     # assert is fine in tests
    "E501",     # the formatter sets line length; long strings and comments are left as written
    "RUF001", "RUF002", "RUF003",   # domain text uses typographic quotes and dashes on purpose
]

[tool.ruff.lint.isort]
known-first-party = ["bureau_core", "canonical", "sources", "clientconfig", "app", "shell_azure"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
"packages/app/src/app/adjustments/sql.py" = ["S608"]  # SQL from code-controlled pieces; values are bound

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "packages/bureau_core/src:packages/canonical/src:packages/sources/src:packages/clientconfig/src:packages/app/src:packages/shell_azure/src"
explicit_package_bases = true
exclude = ["/tests/"]

# Ported from the reference app without full annotations (tracked debt: tighten module by module, then drop).
# Real type errors are still reported; only "missing annotation" rules are relaxed here.
[[tool.mypy.overrides]]
module = [
    "bureau_core", "bureau_core.*", "canonical", "canonical.*", "sources", "sources.*",
    "app.audit", "app.bureaus.*", "app.requests.*", "app.users",  # ported in 1.3a
    "app.adjustments.*", "app.validation.custom", "app.validation.results", "app.validation.tables",  # 1.3b
    "app.ops.*", "app.pipeline.outputs", "app.render", "app.types.*", "app.worker.*",  # 1.3c
    "app.api.*",  # 1.3d
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

# Layer rules (requirements.md §1): enforced in CI by `lint-imports`.
[tool.importlinter]
root_packages = ["bureau_core", "canonical", "sources", "clientconfig", "app", "shell_azure"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: shell -> app -> sources -> canonical -> bureau_core"
type = "layers"
layers = ["shell_azure", "app", "sources", "canonical", "bureau_core"]

[[tool.importlinter.contracts]]
name = "clientconfig is independent of the layers"
type = "forbidden"
source_modules = ["clientconfig"]
forbidden_modules = ["bureau_core", "canonical", "sources", "app", "shell_azure"]

[[tool.importlinter.contracts]]
name = "Only the shell imports a cloud SDK"
type = "forbidden"
source_modules = ["bureau_core", "canonical", "sources", "clientconfig", "app"]
forbidden_modules = ["azure", "boto3", "botocore"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "bureau_core imports no database driver or web framework (SQLAlchemy: SQLite only)"
type = "forbidden"
source_modules = ["bureau_core"]
forbidden_modules = ["flask", "pyodbc", "psycopg", "pymysql"]
allow_indirect_imports = true

# Type-error baseline of the ported modules (bureau_core 49 + validation 18 + canonical/sources 9 errors on 2026-11-05, mostly Optional narrowing). Fix and remove a
# module from this list in follow-up PRs; never add a module to it.
[[tool.mypy.overrides]]
module = [
    "bureau_core.contract",
    "bureau_core.formats.delimited.engine",
    "bureau_core.formats.excel.layout",
    "bureau_core.formats.tudf.engine",
    "bureau_core.formats.tudf.formatters",
    "bureau_core.tudf.convert",
    "bureau_core.tudf.reconcile",
    "bureau_core.types",
    "bureau_core.validation.cascades",
    "bureau_core.validation.engine",
    "bureau_core.validation.parameters",
    "bureau_core.validation.python_rules",
    "bureau_core.validation.rules",
    "app.audit",
    "app.requests.repository",
    "app.requests.stages",
    "app.users",
    "app.api.admin",
    "app.api.auth",
    "app.api.common",
    "app.api.dashboard",
    "app.api.exceptions",
    "app.api.findings",
    "app.api.inputs",
    "app.api.meta",
    "app.api.requests",
    "app.api.rules",
    "app.api.serialize",
    "app.adjustments.repository",
    "app.ops.recovery",
    "app.ops.retention",
    "app.pipeline.outputs",
    "app.render",
    "app.types.commercial.file",
    "app.types.consumer.file",
    "app.worker.runner",
    "app.adjustments.summary",
    "app.validation.custom",
    "app.validation.results",
    "canonical.snapshot",
    "canonical.staging.checks",
    "sources.excel",
]
ignore_errors = true
