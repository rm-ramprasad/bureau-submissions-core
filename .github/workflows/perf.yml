name: Performance (nightly)

on:
  schedule:
    - cron: "30 21 * * *"   # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-system   # the Python from actions/setup-python; uv never downloads one

jobs:
  perf:
    name: Stages within budget (10,000 records)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # GitHub's Python, not uv's download (timed out 2026-11-08)
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m perf -s -p no:cacheprovider packages/app/tests/test_perf.py
