name: Performance (nightly)

on:
  schedule:
    - cron: "30 21 * * *"   # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    name: Stages within budget (10,000 records)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.5"
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run pytest -m perf -s -p no:cacheprovider packages/app/tests/test_perf.py
