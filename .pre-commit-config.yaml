repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: lint-imports
        name: layer rules
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: no-workbooks
        name: no workbooks or CSVs committed
        entry: workbooks and CSVs are local test data only (gitignored)
        language: fail
        files: \.(xlsx|xlsm|xls|csv)$
