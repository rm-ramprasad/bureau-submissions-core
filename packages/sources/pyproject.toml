[project]
name = "sources"
version = "0.1.0"
description = "Source adapters: load one reporting date's raw rows into staging (Excel/CSV upload, database views)."
requires-python = ">=3.14,<3.15"
dependencies = ["openpyxl>=3.1,<4", "canonical"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sources"]

[tool.uv.sources]
canonical = { workspace = true }
