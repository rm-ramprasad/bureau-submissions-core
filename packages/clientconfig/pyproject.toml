[project]
name = "clientconfig"
version = "0.1.0"
description = "Client configuration: versioned settings, product defaults with database overrides, audit, optional approval, export/import."
requires-python = ">=3.14,<3.15"
dependencies = ["SQLAlchemy>=2.0,<3", "PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clientconfig"]
