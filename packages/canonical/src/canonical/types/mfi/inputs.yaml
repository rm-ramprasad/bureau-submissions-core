# MFI input workbook, PROVISIONAL (owner 2026-11-10, ADR 0003 step 6, option 2): drafted before the new client's data
# source is known, so the MFI files can run end to end and the client gets a template to fill. To be adjusted to
# the client's real data (an edit here plus a migration for the tables, as for consumer / commercial).
# Two sheets into automn.stg_mfi_* (format: canonical/staging/spec.py). Headers must match row 1.
#   Loans   one row per loan account: the member, their relatives, IDs, phones, addresses, household and the loan.
#           A member with two loans has two rows (same Member ID; the member's details must agree, MEMBER_FIELDS_DIFFER).
#   Groups  one row per SHG / JLG group: the group and, for SHG files, the group loan.
# Coded columns hold the MFI file code from the spec (docs/specs/UCRF_MFI_v3.3.1.md section 8 / Appendix C, e.g.
# gender F, state TN, loan category T05, relation K02): the views turn them into canonical values through
# automn.ref_code_translation (vw_ref_code), as consumer's code columns do. No loan system view: the loan figures
# (balance, overdue, DPD) are the workbook's, for the upload's as-of date. Sample: tools/mfi_sample_workbook.py.
