# Commercial input workbook (input-templates/Commercial_Submissions_Workbook_Staging.xlsx, 2026-10-30): each visible
# sheet into its automn.stg_commercial_* table (format: submissions/inputs/spec.py). Headers must match row 1.
# Every sheet is keyed by Sanction Reference Number (user, 2026-10-30): the views join the sheets and the loan
# view wip.VwCommercialSubmissionCR on it. '(Name)' columns hold labels, turned into values by the views through
# automn.ref_code_translation.label. Hidden sheets (Instructions, Audit Framework, ...) are never read.
workbook: Commercial submissions workbook (staging)
sheets:
- sheet: BS
  table: stg_commercial_bs
  key: sanction_reference_number
  columns:
    sanction_reference_number: Sanction Reference Number
    flag: Flag
    segment_identifier: Segment Identifier
    member_branch_code: Member Branch Code
    previous_member_branch_code: Previous Member Branch Code
    borrower_name: Borrower‟s Name
    borrower_short_name: Borrower Short Name
    company_registration_number: Company Registration Number
    date_of_incorporation: Date of Incorporation
    pan: PAN
    cin: CIN
