    service_tax_no: 'Service Tax #'
    other_id: Other ID
    borrowers_legal_constitution_label: Borrowers Legal Constitution (Name)
    business_category_label: Business Category (Name)
    business_industry_type_label: Business Industry Type (Name)
    class_of_activity_1: Class of Activity 1
