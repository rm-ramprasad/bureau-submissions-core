# MFI UCRF 3.3.1: canonical value -> MFI file code, per canonical code list.
# Spec: docs/specs/UCRF_MFI_v3.3.1.md (section 8 enumerations, section 9 appendices). Decisions: docs/adr/0003-mfi-format.md.
# Seeded into ref_code_translation / ref_code_group on deploy once MFI is switched on (planned until ADR 0003 step 7);
# only missing rows are inserted: rows edited or added in those tables are kept (the database is the master).
# A canonical value with no active translation cannot be reported in the MFI file: validation flags it.
#
# Not written as codes, so not translated: id_type (each identifier has its own field), address_category,
# relative_role (decides which field a relative goes to).
# Account status (S04-S18) is mostly a translation of credit_facility_status below; S04 current, S05 delinquent and
# S07 closed have no special status and are derived in the layout from the closing date and DPD (step 4).
# Open questions (verify with the CIC, ADR 0003):
#  - state codes: Appendix C mapping (owner, 2026-11-10); Appendix B prints CG/CH, HP/HR, JH/JK the other way round.
#  - occupation: SALARIED / SELF_EMPLOYED / SELF_EMPLOYED_PROFESSIONAL (consumer values) have no MFI code; left
#    untranslated, so such members are flagged until the client or the CIC says which Z code they are.

submission_type: MFI

