# Built-in validation rules: MFI UCRF 3.3.1 (docs/specs/UCRF_MFI_v3.3.1.md; decisions docs/adr/0003-mfi-format.md).
#
# Same engine and rule kinds as consumer and commercial (see types/consumer/rules.yaml): sql (T-SQL text, filtered on
# :snapshot_id; also bound :as_of_date, :one_year_before and the parameters below), python (validation/python_rules.py)
# and cascade (validation/cascades.py account_holder_minimums). Generated as well: a REQUIRED rule per column in
# requirements.yaml and an ENUM rule per code column whose list codes.yaml translates (every "not in the enumeration"
# rule of the spec). Outcomes can be changed per tenant with validation_policy, never by editing this file.
#
# One record = one account x borrower (c_account_holder). The spec's outcomes map one to one (ADR 0003 #6): Record ->
# REJECT_RECORD (the account's line is left out); Field -> REJECT_FIELD, or REJECT_SEGMENT for a row of a list (an
# identifier, phone, e-mail, address or relative), which leaves that row out; the record survives unless the minimums
# fail (cascade: a valid address set; a valid ID or a valid phone; a single-word name needs a valid ID or mobile).
# A group (GRPCRD) problem rejects the group's records (2.7): group rules are written on the account.
# Rules check canonical values (model.yaml), never MFI codes.

pack: MFI-UCRF-3.3
submission_type: MFI
rule_prefix: MFI.                      # built-in rule IDs: MFI.<segment>.<NAME>; custom rules may not use it

segments: {borrower_group: GRP, party: CNS, party_identifier: CNS, party_phone: CNS, party_relative: CNS,
           party_address: ADR, party_email: ADR, account: ACT, account_holder: ACT}

categories:
  - {key: MINIMUM, label: Minimum reporting requirements, segments: [REC]}
  - {key: GROUP,   label: SHG / JLG group,                segments: [GRP]}
  - {key: MEMBER,  label: Member & identifiers,           segments: [CNS]}
  - {key: ADDRESS, label: Address & e-mail,               segments: [ADR]}
  - {key: LOAN,    label: Loan account,                   segments: [ACT, ADJ]}
custom_category: {key: CUSTOM, label: NBFC-specific checks}
default_category: LOAN

cascade:
  name: account_holder_minimums
  settings:
    no_valid_address_rule: MFI.REC.NO_VALID_ADDRESS
    no_phone_or_id_rule: MFI.REC.NO_PHONE_OR_ID
    phone_or_id_from_parameter: phone_or_id_required_from
    qualifying_id_types: [VOTER_ID, AADHAAR, PAN, DRIVING_LICENCE, CKYC, PASSPORT, G_RAM_G]   # 7.3 (not ration card)
    single_word_name_rule: MFI.REC.SINGLE_WORD_NAME
    single_word_name_finding: MFI.CNS.SINGLE_WORD_NAME
    mobile_phone_type: MOBILE

generated:
  required_outcome:
    party: REJECT_RECORD
    account: REJECT_RECORD
    account_holder: REJECT_RECORD
    party_identifier: REJECT_SEGMENT
    party_phone: REJECT_SEGMENT
    party_email: REJECT_SEGMENT
    party_address: REJECT_SEGMENT
    party_relative: REJECT_SEGMENT
    borrower_group: WARN               # group rows hit no record: group rules below are on the account
  enum_outcome_default: REJECT_FIELD
  enum_outcome:
    party.gender: REJECT_RECORD                    # CNSCRD #13 mandatory
    party_address.state_code: REJECT_SEGMENT       # ADRCRD #58 / #61 (record via the cascade if no valid set)
    party_relative.relation: REJECT_SEGMENT        # CNSCRD #16 ... #26: the pair is not reported
    party_phone.phone_type: REJECT_SEGMENT
    account.loan_category: REJECT_RECORD           # ACTCRD #71 mandatory
    account.credit_facility_status: REJECT_RECORD  # ACTCRD #75 mandatory
    account.loan_type: REJECT_FIELD                # ACTCRD #93 (SHG group loans: GRP rules)
    borrower_group.payment_frequency: WARN         # group values are judged by the GRP rules on the account
    borrower_group.loan_type: WARN
    borrower_group.write_off_reason: WARN
    borrower_group.state_code: WARN
    borrower_group.phone_type: WARN
    borrower_group.govt_program: WARN

# Tunable values (Rules & policies page; per-NBFC overrides). The spec's date gates and the ADR 0003 section 10
# choices are parameters, so a client or a CIC answer changes configuration, not code.
parameters:
  - name: min_member_age
    type: int
    default: 16
    min: 0
    max: 99
    label: Minimum member age
    description: Youngest member on the as-of date (CNSCRD #10).
    used_by: [MFI.CNS.UNDER_AGE]
  - name: min_address_length
    type: int
    default: 3
    min: 1
    max: 40
    label: Minimum address length
    description: Shortest acceptable address (permanent, current and group address), in characters (7.7).
    used_by: [MFI.ADR.ADDRESS_TOO_SHORT, MFI.GRP.ADDRESS_INVALID]
  - name: phone_or_id_required_from
    type: date
    default: 2000-01-01
    label: Valid ID or phone required for loans opened from
    description: A member needs a valid ID or a valid telephone (7.3); the spec applies it to every loan (any date before the first loan).
    used_by: [MFI.REC.NO_PHONE_OR_ID]
  - name: family_income_required_from
    type: date
    default: 2022-04-01
    label: Family income required for disbursals from
    description: Total monthly family income is required for loans disbursed on or after this date (CNSCRD #49).
    used_by: [MFI.CNS.FAMILY_INCOME_REQUIRED]
  - name: instalment_required_from
    type: date
    default: 2022-04-01
    label: Instalments required for disbursals from
    description: Number of instalments and instalment amount are required for loans disbursed on or after this date (ACTCRD #84, #86).
    used_by: [MFI.ACT.INSTALMENTS_REQUIRED, MFI.ACT.INSTALMENT_AMOUNT_REQUIRED]
  - name: group_address_required_from
    type: date
    default: 2027-01-01
    label: Group address and phone required for disbursals from
    description: >-
      The SHG group's address, state, PIN and telephone reject the group's records only for loans disbursed on or
      after this date; before it they are warnings (GRPCRD #20-#24; ADR 0003 section 10 #3).
    used_by: [MFI.GRP.ADDRESS_INVALID, MFI.GRP.PHONE_REQUIRED]
  - name: name_salutation_pattern
    type: regex
    default: '^(MR|MRS|MS)\.?$'
    label: Salutations ignored in a name
    description: Regular expression for a word that is a salutation (7.1), matched ignoring case.
    used_by: [MFI.CNS.NAME_NO_VALID_TOKEN, MFI.CNS.SINGLE_WORD_NAME]
  - name: id_pattern_pan
    type: regex
    default: '^[A-Z]{3}[PH][A-Z][0-9]{4}[A-Z]$'
    label: PAN pattern
    description: 10 characters, individuals (P) and HUF (H) only (7.3).
    used_by: [MFI.CNS.ID_FORMAT]
  - name: id_pattern_voter
    type: regex
    default: '^(?=.{8,16}$)[A-Z]{2,3}[A-Z0-9]+$'
    label: Voter ID pattern
    description: 8-16 characters, the first 2 or 3 letters (7.3).
    used_by: [MFI.CNS.ID_FORMAT]
  - name: id_pattern_passport
    type: regex
    default: '^[A-Z][A-Z0-9][0-9]{5,8}$'
    label: Passport pattern
    description: 7-10 characters, a letter, a letter or digit, then digits (7.3).
    used_by: [MFI.CNS.ID_FORMAT]
  - name: id_pattern_ckyc
    type: regex
    default: '^[A-Z0-9]{1,15}$'
    label: CKYC pattern
    description: Up to 15 letters and digits (7.3).
    used_by: [MFI.CNS.ID_FORMAT]
  - name: id_pattern_gram_g
    type: regex
    default: '^[A-Z]{2}-[0-9]{2}-[0-9]{3}-[0-9]{3}-[0-9]{3}/[0-9]{3}[A-Za-z0-9]+$'
    label: G-RAM-G pattern
    description: SS-DD-BBB-GGG-VVV/HHHSurname (7.3).
    used_by: [MFI.CNS.ID_FORMAT]

rules:
  # ------------------------------------------------------------------ CNSCRD member (5, 7.1-7.3, 7.5)
  - id: MFI.CNS.NAME_DIGITS
    entity: party
    field: full_name
    outcome: REJECT_RECORD
    message: Digits are not allowed in member names (7.1)
    python: name_digits
  - id: MFI.CNS.NAME_DISALLOWED_CHARS
    entity: party
    field: full_name
    outcome: REJECT_RECORD
    message: Member name contains a disallowed character (Appendix A)
    python: name_disallowed_chars
  - id: MFI.CNS.NAME_NO_VALID_TOKEN
    entity: party
    field: full_name
    outcome: REJECT_RECORD
    message: Member name needs at least one word of 2 or more letters, salutations not counted (7.1)
    python: name_no_valid_token
  - id: MFI.CNS.NAME_STARTS_WITH_DESCRIPTOR
    entity: party
    field: full_name
    outcome: REJECT_RECORD
    message: Member name must not begin with S/O, W/O, H/O or D/O (7.1)
    python: name_starts_with_descriptor
  - id: MFI.CNS.NAME_TOO_LONG
    entity: party
    field: full_name
    outcome: REJECT_RECORD
    message: Member name does not fit Name 1-3 (100, 50, 50 characters) without splitting a word (7.1)
    python: name_fits_100_50_50
  - id: MFI.CNS.SINGLE_WORD_NAME
    entity: party
    field: full_name
    outcome: WARN
    message: Single-word name. Accepted only with a valid ID or mobile number (see MFI.REC.SINGLE_WORD_NAME)
    python: name_single_word
  - id: MFI.CNS.UNDER_AGE
    entity: party
    field: birth_date
    outcome: REJECT_RECORD
    message: Member is younger than {min_member_age} on the as-of date (CNSCRD #10)
    python: min_age_at_as_of
  - id: MFI.CNS.BIRTH_DATE_INVALID
    entity: party
    field: birth_date
    outcome: REJECT_RECORD
    message: Birth date cannot be after the as-of date or after the loan's disbursal date (CNSCRD #10)
    sql: |
      SELECT p.row_id, h.account_key, p.party_key, p.birth_date AS value
      FROM automn.c_party p
      JOIN automn.c_account_holder h ON h.snapshot_id = p.snapshot_id AND h.party_key = p.party_key
      JOIN automn.c_account a ON a.snapshot_id = h.snapshot_id AND a.account_key = h.account_key
      WHERE p.snapshot_id = :snapshot_id AND (p.birth_date > :as_of_date OR p.birth_date > a.date_opened)
  - id: MFI.CNS.AGE_UNDER_16
    entity: party
    field: age
    outcome: REJECT_FIELD
    message: Member age below {min_member_age} is not reported (CNSCRD #11)
    sql: |
      SELECT p.row_id, NULL AS account_key, p.party_key, p.age AS value
      FROM automn.c_party p WHERE p.snapshot_id = :snapshot_id AND p.age < :min_member_age
  - id: MFI.CNS.FAMILY_INCOME_REQUIRED
    entity: party
    field: family_income
    outcome: REJECT_RECORD
    message: Total monthly family income is required for loans disbursed on or after {family_income_required_from:%d-%m-%Y} (CNSCRD #49)
    sql: |
      SELECT p.row_id, h.account_key, p.party_key, p.family_income AS value
      FROM automn.c_party p
      JOIN automn.c_account_holder h ON h.snapshot_id = p.snapshot_id AND h.party_key = p.party_key
      JOIN automn.c_account a ON a.snapshot_id = h.snapshot_id AND a.account_key = h.account_key
      WHERE p.snapshot_id = :snapshot_id AND a.date_opened >= :family_income_required_from
        AND (p.family_income IS NULL OR p.family_income <= 0)
  - id: MFI.CNS.AMOUNT_NEGATIVE
    entity: party
    field: family_expenses
    outcome: REJECT_FIELD
    message: Family income and expenses cannot be negative (2.3)
    sql: |
      SELECT p.row_id, NULL AS account_key, p.party_key, COALESCE(p.family_expenses, p.family_income) AS value
      FROM automn.c_party p WHERE p.snapshot_id = :snapshot_id AND (p.family_expenses < 0 OR p.family_income < 0)
  - id: MFI.CNS.RELATIVE_INCOMPLETE
    entity: party_relative
    field: relation
    outcome: REJECT_SEGMENT
    message: A relative, key person or nominee needs both a name and a relationship (CNSCRD #15-#26)
    sql: |
      SELECT r.row_id, NULL AS account_key, r.party_key, COALESCE(r.full_name, r.relation) AS value
      FROM automn.c_party_relative r
      WHERE r.snapshot_id = :snapshot_id
        AND (r.full_name IS NULL OR TRIM(r.full_name) = '' OR r.relation IS NULL)
  - id: MFI.CNS.TOO_MANY_RELATIVES
    entity: party_relative
    field: relative_role
    outcome: WARN
    message: Only one key person, four relatives and one nominee are reported; the rest are left out
    sql: |
      SELECT r.row_id, NULL AS account_key, r.party_key, r.relative_role AS value
      FROM automn.c_party_relative r
      WHERE r.snapshot_id = :snapshot_id AND (
        SELECT COUNT(*) FROM automn.c_party_relative x
        WHERE x.snapshot_id = r.snapshot_id AND x.party_key = r.party_key AND x.relative_role = r.relative_role
          AND (COALESCE(x.priority, 0) < COALESCE(r.priority, 0)
               OR (COALESCE(x.priority, 0) = COALESCE(r.priority, 0) AND x.row_id < r.row_id))
      ) >= CASE r.relative_role WHEN 'RELATIVE' THEN 4 ELSE 1 END
  - id: MFI.CNS.ID_FORMAT
    entity: party_identifier
    field: id_number
    outcome: REJECT_SEGMENT
    message: Identifier is not valid for its type (7.3). It is not reported
    python: id_number_format
  - id: MFI.CNS.ID_TYPE_NOT_REPORTABLE
    entity: party_identifier
    field: id_type
    outcome: REJECT_SEGMENT
    message: This identifier type has no field in the member segment (CNSCRD #28-#35)
    sql: |
      SELECT i.row_id, NULL AS account_key, i.party_key, i.id_type AS value
      FROM automn.c_party_identifier i
      WHERE i.snapshot_id = :snapshot_id AND i.id_type NOT IN
        ('VOTER_ID', 'AADHAAR', 'PAN', 'RATION_CARD', 'G_RAM_G', 'CKYC', 'DRIVING_LICENCE', 'PASSPORT')
  - id: MFI.CNS.PHONE_INVALID
    entity: party_phone
    field: phone_number
    outcome: REJECT_SEGMENT
    message: No valid telephone number after removing sequences, repeated digits and truncated numbers (7.5)
    python: phone_number_invalid
  - id: MFI.CNS.MORE_THAN_TWO_PHONES
    entity: party_phone
    field: phone_number
    outcome: WARN
    message: Only the first two telephone numbers (by priority) are reported (CNSCRD #39, #41)
    sql: |
      SELECT t.row_id, NULL AS account_key, t.party_key, t.phone_number AS value
      FROM automn.c_party_phone t
      WHERE t.snapshot_id = :snapshot_id AND (
        SELECT COUNT(*) FROM automn.c_party_phone x
        WHERE x.snapshot_id = t.snapshot_id AND x.party_key = t.party_key
          AND (COALESCE(x.priority, 0) < COALESCE(t.priority, 0)
               OR (COALESCE(x.priority, 0) = COALESCE(t.priority, 0) AND x.row_id < t.row_id))) >= 2

  # ------------------------------------------------------------------ ADRCRD address (6, 7.4, 7.6, 7.7)
  - id: MFI.ADR.ADDRESS_TOO_SHORT
    entity: party_address
    field: address_line_1
    outcome: REJECT_SEGMENT
    message: Address is shorter than {min_address_length} characters (7.7)
    sql: |
      SELECT x.row_id, NULL AS account_key, x.party_key, x.address_line_1 AS value
      FROM automn.c_party_address x
      WHERE x.snapshot_id = :snapshot_id
        AND LEN(TRIM(COALESCE(x.address_line_1, ''))) + LEN(TRIM(COALESCE(x.address_line_2, '')))
          + LEN(TRIM(COALESCE(x.address_line_3, ''))) + LEN(TRIM(COALESCE(x.address_line_4, '')))
          + LEN(TRIM(COALESCE(x.address_line_5, ''))) < :min_address_length
  - id: MFI.ADR.ADDRESS_MEANINGLESS
    entity: party_address
    field: address_line_1
    outcome: REJECT_SEGMENT
    message: Address is only special characters (7.7)
    python: party_address_address_meaningless
  - id: MFI.ADR.STATE_REQUIRED
    entity: party_address
    field: state_code
    outcome: REJECT_SEGMENT
    message: State is required for an address (ADRCRD #58 / #61)
    sql: |
      SELECT x.row_id, NULL AS account_key, x.party_key, NULL AS value
      FROM automn.c_party_address x WHERE x.snapshot_id = :snapshot_id AND x.state_code IS NULL
  - id: MFI.ADR.PIN_FORMAT
    entity: party_address
    field: pin_code
    outcome: REJECT_SEGMENT
    message: PIN must have 6 digits and must not end in 000 (7.4)
    python: pin_format
  - id: MFI.ADR.PIN_STATE_MISMATCH
    entity: party_address
    field: pin_code
    outcome: REJECT_SEGMENT
    message: PIN prefix is outside the state's range (Appendix C)
    python: pin_state_mismatch
  - id: MFI.ADR.NOT_PERMANENT_OR_CURRENT
    entity: party_address
    field: address_category
    outcome: WARN
    message: Only the permanent and the current (residence) address are reported (ADRCRD #57-#62)
    sql: |
      SELECT x.row_id, NULL AS account_key, x.party_key, x.address_category AS value
      FROM automn.c_party_address x
      WHERE x.snapshot_id = :snapshot_id AND COALESCE(x.address_category, '') NOT IN ('PERMANENT', 'RESIDENCE')
  - id: MFI.ADR.EMAIL_INVALID
    entity: party_email
    field: email
    outcome: REJECT_SEGMENT
    message: E-mail fails the checks of 7.6
    python: email_invalid

  # ------------------------------------------------------------------ ACTCRD account (7, 7.2)
  - id: MFI.ACT.DATE_OPENED_INVALID
    entity: account
    field: date_opened
    outcome: REJECT_RECORD
    message: Date opened / disbursed cannot be after the as-of date or after the date closed (ACTCRD #78)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.date_opened AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND (a.date_opened > :as_of_date OR a.date_opened > a.date_closed)
  - id: MFI.ACT.DATE_CLOSED_INVALID
    entity: account
    field: date_closed
    outcome: REJECT_RECORD
    message: Date closed cannot be after the as-of date (ACTCRD #79)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.date_closed AS value
      FROM automn.c_account a WHERE a.snapshot_id = :snapshot_id AND a.date_closed > :as_of_date
  - id: MFI.ACT.LAST_PAYMENT_INVALID
    entity: account
    field: date_last_payment
    outcome: REJECT_FIELD
    message: Date of last payment cannot be after the as-of date or before the date opened (ACTCRD #80)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.date_last_payment AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND (a.date_last_payment > :as_of_date OR a.date_last_payment < a.date_opened)
  - id: MFI.ACT.DISBURSED_NOT_POSITIVE
    entity: account
    field: high_credit_amount
    outcome: REJECT_RECORD
    message: Total amount disbursed must be above 0, except for a cancelled loan (ACTCRD #83; ADR 0003 section 10 #2)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.high_credit_amount AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND a.high_credit_amount <= 0
        AND COALESCE(a.credit_facility_status, '') <> 'CANCELLED'
  - id: MFI.ACT.GROUP_REQUIRED
    entity: account
    field: group_key
    outcome: REJECT_RECORD
    message: A group loan (any category except individual) needs the group identifier (ACTCRD #72)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.loan_category AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND a.loan_category <> 'INDIVIDUAL'
        AND (a.group_key IS NULL OR TRIM(a.group_key) = '')
  - id: MFI.ACT.INSTALMENTS_REQUIRED
    entity: account
    field: repayment_tenure
    outcome: REJECT_RECORD
    message: >-
      Number of instalments and repayment frequency are required for loans disbursed on or after
      {instalment_required_from:%d-%m-%Y} (ACTCRD #84, #85; SHG term loans only)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.repayment_tenure AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND a.date_opened >= :instalment_required_from
        AND (a.repayment_tenure IS NULL OR a.repayment_tenure <= 0 OR a.payment_frequency IS NULL)
        AND (a.loan_category IN ('JLG_GROUP', 'JLG_INDIVIDUAL', 'INDIVIDUAL', 'OTHERS')
             OR COALESCE(a.loan_type, 'TERM_LOAN') = 'TERM_LOAN')
  - id: MFI.ACT.INSTALMENT_AMOUNT_REQUIRED
    entity: account
    field: emi_amount
    outcome: REJECT_RECORD
    message: Instalment amount is required for loans disbursed on or after {instalment_required_from:%d-%m-%Y} (ACTCRD #86)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.emi_amount AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND a.date_opened >= :instalment_required_from
        AND (a.emi_amount IS NULL OR a.emi_amount <= 0)
        AND (a.loan_category IN ('JLG_GROUP', 'JLG_INDIVIDUAL', 'INDIVIDUAL', 'OTHERS')
             OR COALESCE(a.loan_type, 'TERM_LOAN') = 'TERM_LOAN')
  - id: MFI.ACT.BALANCE_ON_CLOSED
    entity: account
    field: current_balance
    outcome: REJECT_RECORD
    message: A closed account (S07, S09, S12) cannot have a balance above 0 (ACTCRD #87)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.current_balance AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND a.current_balance > 0
        AND (a.credit_facility_status IN ('RESTRUCTURED_CLOSED', 'POST_WRITE_OFF_CLOSED')
             OR (a.date_closed IS NOT NULL AND a.credit_facility_status IS NULL))
  - id: MFI.ACT.OVERDUE_DPD_MISMATCH
    entity: account
    field: amount_overdue
    outcome: REJECT_RECORD
    message: Amount overdue and DPD must agree - both above 0 or both 0 (ACTCRD #88, #89)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.amount_overdue AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND (
        (COALESCE(a.amount_overdue, 0) = 0 AND a.days_past_due > 0)
        OR (a.amount_overdue > 0 AND COALESCE(a.days_past_due, 0) = 0)
        OR a.amount_overdue < 0 OR a.days_past_due < 0)
  - id: MFI.ACT.CLOSE_DATE_REQUIRED
    entity: account
    field: date_closed
    outcome: REJECT_RECORD
    message: Restructured & closed (S09) and post write-off closed (S12) accounts need the date closed (ACTCRD #79)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.credit_facility_status AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND a.date_closed IS NULL
        AND a.credit_facility_status IN ('RESTRUCTURED_CLOSED', 'POST_WRITE_OFF_CLOSED')
  - id: MFI.ACT.CLOSE_DATE_NOT_ALLOWED
    entity: account
    field: date_closed
    outcome: REJECT_RECORD
    message: A loan restructured due to COVID-19 (S08) cannot have a date closed (ACTCRD #75)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.date_closed AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND a.date_closed IS NOT NULL
        AND a.credit_facility_status = 'RESTRUCTURED_DUE_TO_COVID_19'
  - id: MFI.ACT.WRITE_OFF_AMOUNT_REQUIRED
    entity: account
    field: written_off_total
    outcome: REJECT_RECORD
    message: Written-off and settled accounts (S06, S10, S11), or a write-off date, need the write-off amount (ACTCRD #90)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.credit_facility_status AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND COALESCE(a.written_off_total, 0) <= 0
        AND (a.credit_facility_status IN ('WRITTEN_OFF', 'SETTLED', 'POST_WO_SETTLED') OR a.write_off_date IS NOT NULL)
  - id: MFI.ACT.WRITE_OFF_DATE_REQUIRED
    entity: account
    field: write_off_date
    outcome: REJECT_RECORD
    message: A write-off amount needs the write-off date (ACTCRD #91)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.written_off_total AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND a.written_off_total > 0 AND a.write_off_date IS NULL
  - id: MFI.ACT.WRITE_OFF_NOT_ALLOWED
    entity: account
    field: written_off_total
    outcome: REJECT_RECORD
    message: Current, delinquent, closed and restructured accounts (S04, S05, S07, S08, S09) cannot report a write-off (ACTCRD #90, #91)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.written_off_total AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND (a.written_off_total > 0 OR a.write_off_date IS NOT NULL)
        AND (a.credit_facility_status IS NULL
             OR a.credit_facility_status IN ('RESTRUCTURED_DUE_TO_COVID_19', 'RESTRUCTURED_CLOSED'))
  - id: MFI.ACT.WRITE_OFF_REASON_NOT_ALLOWED
    entity: account
    field: write_off_reason
    outcome: REJECT_FIELD
    message: A write-off reason is reported only for written-off accounts (ACTCRD #92)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.write_off_reason AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND a.write_off_reason IS NOT NULL
        AND (a.credit_facility_status IS NULL
             OR a.credit_facility_status IN ('RESTRUCTURED_DUE_TO_COVID_19', 'RESTRUCTURED_CLOSED'))
  - id: MFI.ACT.SETTLEMENT_AMOUNT_MISSING
    entity: account
    field: settlement_amount
    outcome: WARN
    message: A settled account (S10, S11) should report the settlement amount (ACTCRD #99)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.credit_facility_status AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND a.credit_facility_status IN ('SETTLED', 'POST_WO_SETTLED')
        AND COALESCE(a.settlement_amount, 0) <= 0
  - id: MFI.ACT.AMOUNT_NEGATIVE
    entity: account
    field: sanctioned_amount
    outcome: REJECT_FIELD
    message: Amounts other than the current balance cannot be negative (2.3)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key,
             COALESCE(a.sanctioned_amount, a.applied_amount, a.settlement_amount, a.sum_assured) AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND (a.sanctioned_amount < 0 OR a.applied_amount < 0
        OR a.settlement_amount < 0 OR a.sum_assured < 0)
  - id: MFI.ACT.AMOUNT_TOO_LARGE
    entity: account
    field: current_balance
    outcome: REJECT_RECORD
    message: An amount has more than 9 digits (2.3, 2.5)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.current_balance AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND (ABS(a.current_balance) > 999999999 OR a.high_credit_amount > 999999999
        OR a.amount_overdue > 999999999 OR a.emi_amount > 999999999)

  # ------------------------------------------------------------------ GRPCRD group (4): rules on the group's accounts
  - id: MFI.GRP.GROUP_MISSING
    entity: account
    field: group_key
    outcome: REJECT_RECORD
    message: An SHG loan (T04-T07) needs its group's details (GRPCRD) in the data
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.group_key AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id
        AND a.loan_category IN ('SHG_GROUP', 'SHG_INDIVIDUAL', 'SHG_GROUP_GOVT', 'SHG_INTRA_GROUP')
        AND NOT EXISTS (SELECT 1 FROM automn.c_borrower_group g
                        WHERE g.snapshot_id = a.snapshot_id AND g.group_key = a.group_key)
  - id: MFI.GRP.NAME_INVALID
    entity: account
    field: group_key
    outcome: REJECT_RECORD
    message: The group's name needs a word of 2 or more letters (GRPCRD #3)
    python: group_name_no_valid_token
  - id: MFI.GRP.LOAN_DETAILS_INVALID
    entity: account
    field: group_key
    outcome: REJECT_RECORD
    message: >-
      The group loan's details are not valid - account number, disbursed amount, dates, balance, overdue and DPD,
      instalments for a term loan, write-off amount and date (GRPCRD #4-#18)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, g.group_key AS value
      FROM automn.c_account a
      JOIN automn.c_borrower_group g ON g.snapshot_id = a.snapshot_id AND g.group_key = a.group_key
      WHERE a.snapshot_id = :snapshot_id
        AND a.loan_category IN ('SHG_GROUP', 'SHG_INDIVIDUAL', 'SHG_GROUP_GOVT', 'SHG_INTRA_GROUP')
        AND (g.group_account_number IS NULL OR TRIM(g.group_account_number) = ''
             OR g.disbursed_amount IS NULL OR g.disbursed_amount < 0 OR g.current_balance IS NULL
             OR g.date_opened IS NULL OR g.date_opened > :as_of_date OR g.date_opened > g.date_closed
             OR g.date_closed > :as_of_date OR (g.current_balance > 0 AND g.date_closed IS NOT NULL)
             OR g.days_past_due IS NULL OR g.days_past_due < 0
             OR (COALESCE(g.amount_overdue, 0) = 0 AND g.days_past_due > 0)
             OR (g.amount_overdue > 0 AND g.days_past_due = 0)
             OR (g.date_closed IS NOT NULL AND g.amount_overdue > 0)
             OR g.loan_type IS NULL
             OR (g.loan_type = 'TERM_LOAN' AND (g.repayment_tenure IS NULL OR g.repayment_tenure <= 0
                 OR g.payment_frequency IS NULL OR g.emi_amount IS NULL OR g.emi_amount <= 0))
             OR (g.write_off_date IS NOT NULL AND COALESCE(g.written_off_total, 0) <= 0)
             OR (g.written_off_total > 0 AND g.write_off_date IS NULL))
  - id: MFI.GRP.ADDRESS_INVALID
    entity: account
    field: group_key
    outcome: REJECT_RECORD
    message: >-
      The group's address (at least {min_address_length} characters), state and PIN are required for loans
      disbursed on or after {group_address_required_from:%d-%m-%Y} (GRPCRD #20-#22)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, g.address_line_1 AS value
      FROM automn.c_account a
      JOIN automn.c_borrower_group g ON g.snapshot_id = a.snapshot_id AND g.group_key = a.group_key
      WHERE a.snapshot_id = :snapshot_id AND g.date_opened >= :group_address_required_from
        AND (LEN(TRIM(COALESCE(g.address_line_1, ''))) < :min_address_length OR g.state_code IS NULL
             OR g.pin_code IS NULL OR TRIM(g.pin_code) = '')
  - id: MFI.GRP.ADDRESS_MISSING
    entity: account
    field: group_key
    outcome: WARN
    message: The group's address, state or PIN is missing (GRPCRD #20-#22; required for loans disbursed from {group_address_required_from:%d-%m-%Y})
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, g.address_line_1 AS value
      FROM automn.c_account a
      JOIN automn.c_borrower_group g ON g.snapshot_id = a.snapshot_id AND g.group_key = a.group_key
      WHERE a.snapshot_id = :snapshot_id AND COALESCE(g.date_opened, :as_of_date) < :group_address_required_from
        AND (g.address_line_1 IS NULL OR g.state_code IS NULL OR g.pin_code IS NULL)
  - id: MFI.GRP.PHONE_REQUIRED
    entity: account
    field: group_key
    outcome: REJECT_RECORD
    message: The group's telephone is required for loans disbursed on or after {group_address_required_from:%d-%m-%Y} (GRPCRD #24)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, g.phone_number AS value
      FROM automn.c_account a
      JOIN automn.c_borrower_group g ON g.snapshot_id = a.snapshot_id AND g.group_key = a.group_key
      WHERE a.snapshot_id = :snapshot_id AND g.date_opened >= :group_address_required_from
        AND (g.phone_number IS NULL OR TRIM(g.phone_number) = '')

  # ------------------------------------------------------------------ record integrity
  - id: MFI.REC.ACCOUNT_MISSING
    entity: account_holder
    field: account_key
    outcome: REJECT_RECORD
    message: Holder points at an account that was not extracted
    sql: |
      SELECT h.row_id, h.account_key, h.party_key, h.account_key AS value
      FROM automn.c_account_holder h
      WHERE h.snapshot_id = :snapshot_id AND NOT EXISTS (
        SELECT 1 FROM automn.c_account a WHERE a.snapshot_id = h.snapshot_id AND a.account_key = h.account_key)
  - id: MFI.REC.PARTY_MISSING
    entity: account_holder
    field: party_key
    outcome: REJECT_RECORD
    message: Holder points at a member that was not extracted
    sql: |
      SELECT h.row_id, h.account_key, h.party_key, h.party_key AS value
      FROM automn.c_account_holder h
      WHERE h.snapshot_id = :snapshot_id AND NOT EXISTS (
        SELECT 1 FROM automn.c_party p WHERE p.snapshot_id = h.snapshot_id AND p.party_key = h.party_key)
  - id: MFI.REC.DUPLICATE_ACCOUNT_KEY
    entity: account
    field: account_key
    outcome: REJECT_RECORD
    message: The same account key was extracted more than once (check the mapping)
    sql: |
      SELECT a.row_id, a.account_key, NULL AS party_key, a.account_key AS value
      FROM automn.c_account a
      WHERE a.snapshot_id = :snapshot_id AND a.account_key IN (
        SELECT d.account_key FROM automn.c_account d WHERE d.snapshot_id = :snapshot_id
        GROUP BY d.account_key HAVING COUNT(*) > 1)

  # ------------------------------------------------------------------ user adjustments (Exceptions page)
  - id: MFI.ADJ.NOT_FOUND
    entity: account
    outcome: WARN
    message: Exclusion or override matches no loan or customer in this snapshot
    sql: |
      SELECT NULL AS row_id, NULL AS account_key, NULL AS party_key,
             CONCAT_WS(' ', v.kind, COALESCE(v.account_number, v.customer_id), v.field) AS value
      FROM automn.v_snapshot_adjustment v
      WHERE v.snapshot_id = :snapshot_id AND v.loans_affected = 0

  # ------------------------------------------------------------------ cascade (record decisions)
  - id: MFI.REC.NO_VALID_ADDRESS
    entity: account_holder
    outcome: REJECT_RECORD
    message: Neither the permanent nor the current address is valid (ADRCRD; 2.7)
    cascade: true
  - id: MFI.REC.NO_PHONE_OR_ID
    entity: account_holder
    outcome: REJECT_RECORD
    message: No valid ID (voter ID, Aadhaar, PAN, driving licence, CKYC, passport, G-RAM-G) and no valid telephone (7.3)
    cascade: true
  - id: MFI.REC.SINGLE_WORD_NAME
    entity: account_holder
    outcome: REJECT_RECORD
    message: Single-word name without a valid ID or mobile number (7.1)
    cascade: true
