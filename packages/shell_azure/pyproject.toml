[project]
name = "shell-azure"
version = "0.1.0"
description = "Azure shell: Functions entry points and the Azure adapters (Blob, Storage queues, Entra, Azure SQL token)."
requires-python = ">=3.14,<3.15"
dependencies = ["azure-functions>=1.25,<1.26", "azure-identity>=1.19,<2", "azure-storage-blob>=12.24,<13", "azure-storage-queue>=12.12,<13", "pyodbc>=5.5.0,<6", "app"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shell_azure"]

[tool.uv.sources]
app = { workspace = true }
